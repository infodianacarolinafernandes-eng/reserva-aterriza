document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ckground:#1A0C0E;color:#F7ECD4;font-family:'Lato',system-ui,sans-serif;-webkit-font-smoothing:antialiased}\nbody::after{content:\"\";position:fixed;inset:0;pointer-events:none;z-index:200;opacity:.045;mix-blend-mode:screen;background-image:url(\"30f98220-b739-41d4-8f81-c3a81908d0b7\");background-size:200px 200px}\na{color:#DCC8A3;text-decoration:none}\na:hover{color:#F7ECD4}\n*{box-sizing:border-box}\ninput::placeholder,textarea::placeholder{color:#8C7B6E}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh;background:#1A0C0E;color:#F7ECD4\">\n\n<header style=\"border-bottom:1px solid rgba(212,175,55,0.18);background:#140A0B\">\n  <nav style=\"max-width:1100px;margin:0 auto;padding:18px clamp(20px,5vw,48px);display:flex;align-items:center;justify-content:space-between;gap:20px\">\n    <a href=\"{{ homeUrl }}\" style=\"font-family:'Playfair Display',serif;font-style:italic;font-size:24px;color:#F7ECD4\">Aterriza<\u002Fa>\n    <a href=\"{{ homeUrl }}\" style=\"font-size:12px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:#EAE0D5\">← Volver<\u002Fa>\n  <\u002Fnav>\n<\u002Fheader>\n\n<sc-if value=\"{{ isForm }}\" hint-placeholder-val=\"{{ true }}\">\n<main style=\"max-width:1100px;margin:0 auto;padding:clamp(72px,9vw,128px) clamp(20px,5vw,48px) clamp(96px,10vw,140px);display:flex;flex-direction:column;gap:clamp(56px,7vw,96px)\">\n\n  <div style=\"display:flex;flex-direction:column;gap:24px\">\n    <p style=\"margin:0;font-family:'Special Elite','Courier New',monospace;font-size:clamp(15px,1.3vw,18px);letter-spacing:0.02em;color:#DCC8A3\">Reserva tu asesoría 1:1<\u002Fp>\n    <h1 style=\"margin:0;max-width:16ch;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(42px,6vw,92px);line-height:1.04;letter-spacing:-0.025em\">Empecemos a <em style=\"font-style:italic;color:#DCC8A3\">aterrizar<\u002Fem><\u002Fh1>\n  <\u002Fdiv>\n\n  <section style=\"display:flex;flex-direction:column;gap:32px;padding-top:32px;border-top:1px solid rgba(212,175,55,0.35)\">\n    <h2 style=\"margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(28px,3vw,40px)\">Datos básicos<\u002Fh2>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:28px 40px\">\n      <label style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">Nombre y apellido *<\u002Fspan><input sc-camel-on-input=\"{{ setNombre }}\" type=\"text\" autocomplete=\"name\" style=\"background:transparent;border:0;border-bottom:1px solid rgba(212,175,55,0.45);padding:12px 0;font-family:'Lato',sans-serif;font-size:17px;color:#F7ECD4;outline:none\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">Correo electrónico *<\u002Fspan><input sc-camel-on-input=\"{{ setEmail }}\" type=\"email\" autocomplete=\"email\" style=\"background:transparent;border:0;border-bottom:1px solid rgba(212,175,55,0.45);padding:12px 0;font-family:'Lato',sans-serif;font-size:17px;color:#F7ECD4;outline:none\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">Teléfono / WhatsApp *<\u002Fspan><input sc-camel-on-input=\"{{ setTel }}\" type=\"tel\" autocomplete=\"tel\" placeholder=\"Con código de país, ej. +58 414…\" style=\"background:transparent;border:0;border-bottom:1px solid rgba(212,175,55,0.45);padding:12px 0;font-family:'Lato',sans-serif;font-size:17px;color:#F7ECD4;outline:none\"><\u002Flabel>\n      <label style=\"display:flex;flex-direction:column;gap:10px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">Instagram o sitio web<\u002Fspan><input sc-camel-on-input=\"{{ setIg }}\" type=\"text\" placeholder=\"Si tienes\" style=\"background:transparent;border:0;border-bottom:1px solid rgba(212,175,55,0.45);padding:12px 0;font-family:'Lato',sans-serif;font-size:17px;color:#F7ECD4;outline:none\"><\u002Flabel>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:36px;padding-top:32px;border-top:1px solid rgba(212,175,55,0.35)\">\n    <h2 style=\"margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(28px,3vw,40px)\">Diagnóstico de necesidad<\u002Fh2>\n    <label style=\"display:flex;flex-direction:column;gap:10px;max-width:760px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">¿Cuál es tu proyecto, idea o negocio actual? *<\u002Fspan><span style=\"font-size:15px;font-weight:300;color:#CDBFAE\">Escríbelo brevemente<\u002Fspan><textarea sc-camel-on-input=\"{{ setProyecto }}\" rows=\"3\" style=\"background:rgba(255,255,255,0.03);border:1px solid rgba(212,175,55,0.35);border-radius:2px;padding:14px 16px;font-family:'Lato',sans-serif;font-size:16px;line-height:1.7;color:#F7ECD4;outline:none;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:760px\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">¿Qué es lo que más te tiene atascado/a hoy? *<\u002Fspan>\n      <sc-for list=\"{{ atascos }}\" as=\"o\" hint-placeholder-count=\"4\">\n        <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:flex-start;gap:16px;text-align:left;padding:18px 20px;border-radius:2px;border:1px solid {{ o.border }};background:{{ o.bg }};color:#F7ECD4;font-family:'Lato',sans-serif;font-size:16px;line-height:1.6;cursor:pointer;transition:all .3s\"><span style=\"flex:none;margin-top:4px;width:16px;height:16px;border-radius:50%;border:1px solid #D4AF37;background:{{ o.dot }}\"><\u002Fspan>{{ o.label }}<\u002Fbutton>\n      <\u002Fsc-for>\n      <sc-if value=\"{{ isOtro }}\" hint-placeholder-val=\"{{ false }}\"><input sc-camel-on-input=\"{{ setOtro }}\" type=\"text\" placeholder=\"Cuéntame qué otra cosa…\" style=\"background:transparent;border:0;border-bottom:1px solid rgba(212,175,55,0.45);padding:12px 0;font-family:'Lato',sans-serif;font-size:16px;color:#F7ECD4;outline:none\"><\u002Fsc-if>\n    <\u002Fdiv>\n    <label style=\"display:flex;flex-direction:column;gap:10px;max-width:760px\"><span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">¿Por qué sientes que la asesoría 1:1 Aterriza es exactamente lo que necesitas en este momento? *<\u002Fspan><textarea sc-camel-on-input=\"{{ setPorque }}\" rows=\"4\" style=\"background:rgba(255,255,255,0.03);border:1px solid rgba(212,175,55,0.35);border-radius:2px;padding:14px 16px;font-family:'Lato',sans-serif;font-size:16px;line-height:1.7;color:#F7ECD4;outline:none;resize:vertical\"><\u002Ftextarea><\u002Flabel>\n  <\u002Fsection>\n\n  <section style=\"display:flex;flex-direction:column;gap:36px;padding-top:32px;border-top:1px solid rgba(212,175,55,0.35)\">\n    <h2 style=\"margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(28px,3vw,40px)\">Plan y método de pago<\u002Fh2>\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:760px\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">Selecciona tu opción de pago *<\u002Fspan>\n      <sc-for list=\"{{ planes }}\" as=\"o\" hint-placeholder-count=\"3\">\n        <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:flex-start;gap:16px;text-align:left;padding:20px;border-radius:2px;border:1px solid {{ o.border }};background:{{ o.bg }};color:#F7ECD4;font-family:'Lato',sans-serif;cursor:pointer;transition:all .3s\"><span style=\"flex:none;margin-top:6px;width:16px;height:16px;border-radius:50%;border:1px solid #D4AF37;background:{{ o.dot }}\"><\u002Fspan><span style=\"display:flex;flex-direction:column;gap:4px;flex:1\"><span style=\"display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap\"><span style=\"font-family:'Playfair Display',serif;font-size:21px\">{{ o.label }}<\u002Fspan><span style=\"font-family:'Playfair Display',serif;font-size:21px;color:#DCC8A3\">{{ o.price }}<\u002Fspan><\u002Fspan><span style=\"font-size:15px;font-weight:300;line-height:1.6;color:#CDBFAE\">{{ o.desc }}<\u002Fspan><\u002Fspan><\u002Fbutton>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:14px;max-width:760px\">\n      <span style=\"font-size:12px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;color:#EAE0D5\">¿Qué método de pago vas a utilizar? *<\u002Fspan>\n      <div style=\"display:flex;flex-wrap:wrap;gap:12px\">\n        <sc-for list=\"{{ metodos }}\" as=\"o\" hint-placeholder-count=\"3\">\n          <button type=\"button\" sc-camel-on-click=\"{{ o.pick }}\" style=\"display:flex;align-items:center;gap:12px;padding:16px 22px;border-radius:2px;border:1px solid {{ o.border }};background:{{ o.bg }};color:#F7ECD4;font-family:'Lato',sans-serif;font-size:16px;cursor:pointer;transition:all .3s\"><span style=\"flex:none;width:14px;height:14px;border-radius:50%;border:1px solid #D4AF37;background:{{ o.dot }}\"><\u002Fspan>{{ o.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n\n  <sc-if value=\"{{ hasMetodo }}\" hint-placeholder-val=\"{{ false }}\">\n  <section style=\"display:flex;flex-direction:column;gap:32px;padding:clamp(28px,4vw,48px);border:1px solid rgba(212,175,55,0.5);background:rgba(59,10,17,0.55)\">\n    <h2 style=\"margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(26px,2.8vw,36px)\">Datos para completar <em style=\"font-style:italic;color:#DCC8A3\">tu pago<\u002Fem><\u002F Courier New',monospace;font-size:clamp(15px,1.3vw,18px);color:#DCC8A3\">{{ doneKicker }}<\u002Fp>\n  <h1 style=\"margin:0;font-family:'Playfair Display',serif;font-weight:400;font-size:clamp(40px,5.6vw,84px);line-height:1.05;letter-spacing:-0.025em\">{{ doneTitle }}<\u002Fh1>\n  <p style=\"margin:0;max-width:56ch;font-size:clamp(17px,1.4vw,19px);font-weight:300;line-height:1.8;color:#EAE0D5\">{{ doneText }}<\u002Fp>\n  <a href=\"{{ doneUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"align-self:flex-start;display:inline-flex;align-items:center;gap:14px;background:#F7ECD4;color:#3B0A11;border:1px solid #F7ECD4;font-family:'Special Elite','Courier New',monospace;font-size:14px;text-transform:uppercase;letter-spacing:2px;padding:20px 34px;border-radius:2px;transition:all .5s ease\" style-hover=\"background:transparent;color:#F7ECD4;border-color:#D4AF37\">{{ doneBtn }} <span style=\"font-family:'Lato',sans-serif;font-size:16px;letter-spacing:0\">→<\u002Fspan><\u002Fa>\n  <sc-if value=\"{{ paid }}\" hint-placeholder-val=\"{{ false }}\"><p style=\"margin:0;font-size:14px;font-style:italic;color:#CDBFAE\">{{ redirectNote }}<\u002Fp><\u002Fsc-if>\n  <p style=\"margin:0;max-width:60ch;padding-top:28px;border-top:1px solid rgba(212,175,55,0.35);font-size:15px;font-weight:300;line-height:1.7;color:#CDBFAE\">¿Tienes alguna duda o prefieres confirmar tu horario directamente conmigo? <a href=\"{{ waUrl }}\" target=\"_blank\" rel=\"noopener\" style=\"color:#DCC8A3;border-bottom:1px solid #D4AF37\">Haz clic aquí para enviarme un mensaje por WhatsApp.<\u002Fa><\u002Fp>\n<\u002Fmain>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;calendarUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://calendar.app.google/sUBakVp5Nc3saern7&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Enlaces&quot;},&quot;whatsappUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://wa.me/584142501483&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Enlaces&quot;},&quot;formEndpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Envío de respuestas&quot;},&quot;homeUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Aterriza Landing v13.html&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Enlaces&quot;}}\">\nclass Component extends DCLogic {\n  constructor(p) { super(p); this.v = {}; this.state = { t: 0 }; this.step = 'form'; this.count = 6; }\n  up() { this.setState(s => ({ t: s.t + 1 })); this.forceUpdate(); }\n  set(k) { return e => { this.v[k] = e.target.value; }; }\n  pick(k, val) { return () => { this.v[k] = val; this.error = ''; this.up(); }; }\n  opts(k, list) {\n    return list.map(o => { const on = this.v[k] === o.id;\n      return Object.assign({}, o, { pick: this.pick(k, o.id), border: on ? '#D4AF37' : 'rgba(212,175,55,0.3)', bg: on ? 'rgba(212,175,55,0.1)' : 'transparent', dot: on ? '#D4AF37' : 'transparent' }); });\n  }\n  componentWillUnmount() { clearInterval(this.timer); }\n  async submit() {\n    const v = this.v, need = [['nombre','tu nombre'],['email','tu correo'],['tel','tu teléfono'],['proyecto','tu proyecto'],['atasco','qué te tiene atascado/a'],['porque','por qué Aterriza'],['plan','tu opción de pago'],['metodo','tu método de pago']];\n    const miss = need.filter(([k]) => !(v[k] || '').toString().trim()).map(x => x[1]);\n    if (miss.length) { this.error = 'Falta completar: ' + miss.join(', ') + '.'; this.up(); return; }\n    this.sending = true; this.up();\n    const ep = this.props.formEndpoint || 'https://script.google.com/macros/s/AKfycbw4XvDmLHy2hX8dFnfN8iDeNpSYw6Kvc9G65kcjr7xXwYLjJakBjoypGS4o_vWCxQNL/exec';\n    if (ep) {\n      try {\n        if (ep.includes('script.google.com')) {\n          const body = new URLSearchParams();\n          Object.entries(v).forEach(([k, val]) => body.append(k, val || ''));\n          if (this.file) {\n            const b64 = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.onerror = rej; r.readAsDataURL(this.file); });\n            body.append('fileData', b64); body.append('fileName', this.file.name); body.append('fileType', this.file.type || 'application/octet-stream');\n          }\n          await fetch(ep, { method: 'POST', mode: 'no-cors', body });\n        } else {\n          const fd = new FormData();\n          Object.entries(v).forEach(([k, val]) => fd.append(k, val));\n          if (this.file) fd.append('comprobante', this.file);\n          await fetch(ep, { method: 'POST', body: fd, headers: { Accept: 'application/json' } });\n        }\n      } catch (e) {}\n    }\n    this.sending = false; this.step = 'done'; this.up();\n    window.scrollTo(0, 0);\n    if (this.file) {\n      this.count = 6;\n      this.timer = setInterval(() => { this.count--; this.up(); if (this.count <= 0) { clearInterval(this.timer); window.location.href = this.calUrl(); } }, 1000);\n    }\n  }\n  calUrl() { return this.props.calendarUrl || 'https://calendar.app.google/sUBakVp5Nc3saern7'; }\n  renderVals() {\n    const p = this.props, v = this.v, wa = p.whatsappUrl || 'https://wa.me/584142501483';\n    const paid = !!this.file;\n    const waMsg = wa + '?text=' + encodeURIComponent(`Hola Diana, soy ${v.nombre || ''}. Acabo de llenar el formulario de Aterriza (${v.plan || ''}, ${v.metodo || ''}) y quiero coordinar mi pago y mi sesión.`);\n    return {\n      homeUrl: p.homeUrl || 'Aterriza Landing v13.html',\n      waUrl: wa,\n      isForm: this.step === 'form', isDone: this.step === 'done', paid,\n      setNombre: this.set('nombre'), setEmail: this.set('email'), setTel: this.set('tel'), setIg: this.set('ig'),\n      setProyecto: this.set('proyecto'), setPorque: this.set('porque'), setOtro: this.set('otro'),\n      atascos: this.opts('atasco', [\n        { id: 'Tengo mil ideas y no sé cuál priorizar ni cómo estructurarla', label: 'Tengo mil ideas y no sé cuál priorizar ni cómo estructurarla.' },\n        { id: 'No sé cómo empaquetar mi conocimiento en una oferta/producto deseable', label: 'No sé cómo empaquetar mi conocimiento en una oferta/producto deseable.' },\n        { id: 'Siento que mi mensaje actual no conecta ni transmite mi verdadera esencia', label: 'Siento que mi mensaje actual no conecta ni transmite mi verdadera esencia.' },\n        { id: 'Otro', label: 'Otro' }]),\n      isOtro: v.atasco === 'Otro',\n      planes: this.opts('plan', [\n        { id: 'Pago único $222', label: 'Pago único', price: '$222', desc: 'Descuento especial por pago de contado.' },\n        { id: '2 cuotas de $111', label: 'Plan de 2 cuotas', price: '2 × $111', desc: '50% para reservar y 50% el día de la segunda sesión.' },\n        { id: '3 cuotas de $77', label: 'Plan de 3 cuotas', price: '3 × $77', desc: '$77 para reservar, $77 el día de la segunda sesión y $77 antes de la última sesión.' }]),\n      metodos: this.opts('metodo', [{ id: 'Zelle', label: 'Zelle' }, { id: 'Pago Móvil', label: 'Pago Móvil (Venezuela)' }, { id: 'PayPal', label: 'PayPal (+ comisión)' }]),\n      hasMetodo: !!v.metodo,\n      setFile: e => { this.file = e.target.files && e.target.files[0]; this.up(); },\n      fileLabel: this.file ? '✓ ' + this.file.name : 'Sube la captura o foto de tu pago aquí',\n      hasError: !!this.error, error: this.error || '',\n      submit: () => this.submit(),\n      submitLabel: this.sending ? 'Enviando…' : 'Enviar formulario',\n      doneKicker: paid ? '¡Gracias, ' + (v.nombre || '').split(' ')[0] + '!' : 'Formulario recibido',\n      doneTitle: paid ? '¡Pago registrado con éxito!' : 'Un paso más para reservar tu lugar',\n      doneText: paid ? 'Haz clic abajo para agendar el día y la hora de tu sesión Aterriza.' : 'Como aún no adjuntaste tu comprobante, escríbeme por WhatsApp para coordinar tu pago y agendar tu sesión.',\n      doneBtn: paid ? 'Agendar mi sesión' : 'Escribir por WhatsApp',\n      doneUrl: paid ? this.calUrl() : waMsg,\n      redirectNote: 'Te llevaremos al calendario automáticamente en ' + this.count + ' s…',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
